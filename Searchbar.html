<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Card UI</title>

    <style>
        body {
            background-color: #000;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* wrapper container */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 40px 20px;
        }


        /* Search Box */
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5rem;
        }

        /* Search Input */
        .search-box input {
            width: 250px;
            padding: 14px 18px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: #111;
            color: #aaa;
            font-size: 16px;
        }

        /* Card Container */
        .card-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding: 40px;
            justify-items: center;
        }

        /* Card */
        .card {
            position: relative;
            width: 300px;
            height: 440px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        /* Background Image */
        .bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Blurred Bottom Layer */
        .blurred-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            backdrop-filter: blur(10px);
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
            z-index: 1;
        }

        /* Content */
        .content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: white;
            z-index: 2;
        }

        .content h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .content p {
            font-size: 14px;
            color: #ddd;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div class="search-box">
        <input type="text" placeholder="Search....." class="inp">
    </div>

    <div class="wrapper">
        <div class="card-container">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1511367461989-f85a21fda167?w=600" alt="image"
                    class="bg-img">

                <div class="blurred-layer"></div>

                <div class="content">
                    <h3>User123</h3>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="searchBar.js"></script>
</body>

</html>
