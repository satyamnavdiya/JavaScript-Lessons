<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS with keyborad</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        body{
            width: 100%;
            height: 100%;
            background: #222;
        }
        div{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }
        h2{
            color: #555;
            font-size: 20rem;
            user-select: none;
            text-transform: capitalize;
            letter-spacing: -1rem;
        }
        input{
            display: none;
        }
        #btn{
            padding: 12px 22px;
            background: green;
            color: white;
            border-radius: 7px;
            border: none;
        }
        #btn:hover{
            background: darkgreen;
        }
    </style>
</head>
<body>

    <div >
        <h2>A</h2>
    </div>

    <div>
        <input type="file" >
        <button id="btn">Upload file</button>
    </div>
    <script src="KeyboradEvent.js"></script>
</body>
</html>
