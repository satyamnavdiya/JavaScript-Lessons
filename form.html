<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form With Event</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
            background-color: #222;
        }

        input{
            display: block;
        }

        #main{
            padding: 50px;
            color: #555;
        }
        
        .card {
            max-width: 300px;
            margin-top: 40px;
            display: inline-block;
            padding: 20px;
            border: 2px solid white;
            border-radius: 10px;
            color: white;
        }

        .profile{
            width: 40px;
            height: 40px;
            background:red;
            border-radius: 50%;
            overflow: hidden;
        }

        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card p{
            font-size: 12px;
            margin-top: 10px;
        }

        .card h5{
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="main">
        
    <form action="">
        <input type="text" placeholder="profile pic link">
        <input type="text" placeholder="name">
        <input type="text" placeholder="occupation">
        <input type="text" placeholder="info">
        <input type="submit" value="Submit">
    </form>
    </div>
